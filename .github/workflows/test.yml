name: ROS2 Test

on: push

jobs:
  test:
    runs-on: ubuntu-22.04
    container: ryuichiueda/ubuntu22.04-ros2:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-requests python3-pytest python3-pytest-cov python3-flake8 python3-pydocstyle

      - name: Build and test ROS2 workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          mkdir -p /root/ros2_ws/src
          rsync -av ./ /root/ros2_ws/src/mypkg/

          cd /root/ros2_ws
          colcon build --event-handlers console_direct+

          source install/setup.bash
          
          bash ./src/mypkg/test/test_dealer.bash /root/ros2_ws
          
          bash ./src/mypkg/test/test_judge.bash /root/ros2_ws
